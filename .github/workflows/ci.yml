name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Build ArchMap from its own source
        run: |
          python -m archmap build . --config examples/archmap_v3.archmap.json --out .archmap/self
          python -m archmap check .archmap/self/architecture.json

  plugin:
    name: DSH plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Package self-check
        run: npm run prepack
      - name: Plugin tests
        run: npm test
