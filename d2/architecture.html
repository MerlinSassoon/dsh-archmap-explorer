<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArchMap · student_system</title>
<style>

  :root {
    --bg: #080b10; --panel: #111720; --panel-2: #151c27; --ink: #e7edf7;
    --muted: #7f8da3; --muted-2: #56657a; --line: #263142;
    --line-soft: rgba(148, 163, 184, .14); --edge: #65738a; --accent: #6ea8ff;
    --green: #8bdc64; --amber: #ffb454; --red: #ff707b;
    --shadow: 0 18px 50px rgba(0, 0, 0, .42);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light dark;
    --method-bg: #f8fafc;
    --method-glow: rgba(59,130,246,.08);
    --method-text: #334155;
    --method-title: #0f172a;
    --method-muted: #64748b;
    --method-muted-2: #94a3b8;
    --method-border: #dbe4ef;
    --method-border-soft: #edf2f7;
    --method-panel: #ffffff;
    --method-panel-hover: #f4f8ff;
    --method-accent: #1e3a8a;
    --method-warning: #b45309;
    --method-shadow: 0 8px 24px rgba(15,23,42,.045);
    --method-source-bg: #0f172a;
    --method-source-text: #dbeafe;
    --method-source-muted: #64748b;
    --ui-caption: 10.5px;
    --ui-meta: 11.5px;
    --ui-body: 12.5px;
    --ui-label: 11px;
    --ui-title: 18px;
    --ui-detail: 13px;
  }
  body.is-resizing-detail { cursor: col-resize; user-select: none; }
  body.is-resizing-detail * { cursor: col-resize !important; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden; color: var(--ink);
    background: radial-gradient(circle at 28% 10%, rgba(66,99,154,.13), transparent 32%),
      radial-gradient(circle at 84% 84%, rgba(121,84,172,.09), transparent 34%), var(--bg);
    font-family: var(--font); -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .app { height: 100vh; min-height: 650px; display: flex; flex-direction: column; }

  .topbar {
    flex: 0 0 66px; height: 66px; display: flex; align-items: center; gap: 18px;
    padding: 0 20px; border-bottom: 1px solid var(--line-soft);
    background: rgba(9,13,19,.90); backdrop-filter: blur(18px); z-index: 40;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 210px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(110,168,255,.20), rgba(155,140,255,.08)), #111a28;
    border: 1px solid rgba(110,168,255,.32);
    box-shadow: inset 0 0 20px rgba(110,168,255,.10), 0 0 20px rgba(110,168,255,.07);
  }
  .brand-mark svg { width: 21px; height: 21px; }
  .brand-title { font-size: 14px; font-weight: 740; line-height: 1.1; }
  .brand-sub { margin-top: 4px; color: var(--muted); font-size: 10.5px; letter-spacing: .02em; }
  .project-chip {
    display: flex; align-items: center; gap: 9px; padding-left: 18px;
    border-left: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; white-space: nowrap;
  }
  .project-chip strong { color: var(--ink); font-weight: 650; }
  .project-chip .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 11px var(--green); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .save-state { color: var(--muted-2); font-size: 10.5px; margin-right: 3px; white-space: nowrap; }
  .btn {
    height: 34px; border: 1px solid var(--line); border-radius: 8px; background: rgba(17,23,32,.76);
    color: var(--muted); font-size: 11.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    padding: 0 10px; transition: .16s ease;
  }
  .btn:hover { color: var(--ink); border-color: #3b4a60; background: var(--panel-2); }
  .btn.primary { color: #d9e8ff; border-color: rgba(110,168,255,.38); background: rgba(110,168,255,.10); }
  .btn.primary:hover { background: rgba(110,168,255,.18); border-color: rgba(110,168,255,.66); }
  .btn[aria-pressed="true"] { color: #cde8ff; border-color: rgba(110,168,255,.52); background: rgba(110,168,255,.13); }
  .icon-btn {
    width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(17,23,32,.76); color: var(--muted); display: grid; place-items: center; cursor: pointer;
    transition: .16s ease;
  }
  .icon-btn:hover { color: var(--ink); border-color: #3b4a60; background: var(--panel-2); }

  .nav-bar {
    flex: 0 0 46px; height: 46px; display: flex; align-items: center; gap: 9px;
    padding: 0 18px; border-bottom: 1px solid var(--line-soft); background: rgba(10,14,20,.72); z-index: 30;
  }
  .back-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .back-btn:hover:not(:disabled) { color: var(--ink); background: rgba(255,255,255,.04); }
  .back-btn:disabled { opacity: .28; cursor: default; }
  .breadcrumb { min-width: 0; display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted-2); white-space: nowrap; overflow: hidden; }
  .breadcrumb button { border: 0; background: transparent; color: var(--muted); padding: 2px 1px; cursor: pointer; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumb button:hover { color: var(--ink); }
  .breadcrumb b { color: var(--ink); font-weight: 620; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumb .slash { color: #3a465a; }
  .nav-spacer { flex: 1 1 auto; }
  .search-wrap {
    width: min(280px, 24vw); height: 30px; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 7px; background: rgba(17,23,32,.58); padding: 0 9px; transition: .16s ease;
  }
  .search-wrap:focus-within { border-color: rgba(110,168,255,.58); background: #121a25; box-shadow: 0 0 0 3px rgba(110,168,255,.08); }
  .search-wrap svg { width: 13px; height: 13px; color: var(--muted-2); flex: 0 0 auto; }
  .search-wrap input { width: 100%; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font-size: 12px; }
  .search-wrap input::placeholder { color: var(--muted-2); }
  .search-wrap.is-disabled { opacity: .36; pointer-events: none; }
  .page-hint { color: var(--muted-2); font-size: 11px; white-space: nowrap; }

  .flow-card-node .module-kind { color: #8bdc64; }
  .flow-card-node .module-api-chip.is-entry { border-color: rgba(139,220,100,.58); background: rgba(139,220,100,.12); color: #dcf8cc; }
  .flow-card-node { border-color: rgba(var(--mc-rgb), .62); }

  .flow-picker {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: none; align-items: center; gap: 5px; max-width: min(760px, calc(100% - 80px));
    padding: 5px 7px; overflow-x: auto; border: 1px solid rgba(110,168,255,.26); border-radius: 9px;
    background: rgba(9,14,21,.86); backdrop-filter: blur(14px); box-shadow: 0 10px 28px rgba(0,0,0,.28);
  }
  .flow-picker.is-visible { display: flex; }
  .flow-picker > span { flex: 0 0 auto; color: #7f93ac; font-family: var(--mono); font-size: 10.5px; letter-spacing: .03em; }
  .flow-picker button { flex: 0 0 auto; border: 1px solid var(--line-soft); border-radius: 999px; padding: 3px 9px; background: rgba(255,255,255,.025); color: #8fa2ba; font-family: var(--mono); font-size: 10.5px; cursor: pointer; }
  .flow-picker button:hover { color: #dbeafe; border-color: rgba(96,165,250,.48); }
  .flow-picker button.is-active { color: #d7f4c9; border-color: rgba(139,220,100,.46); background: rgba(139,220,100,.09); }
  .viewport.is-light .flow-picker { background: rgba(255,255,255,.9); border-color: #dbe3ee; }
  .viewport.is-light .flow-picker button { color: #64748b; }

  .workspace { flex: 1 1 auto; min-height: 0; display: flex; }
  .viewport {
    position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; cursor: grab;
    background: radial-gradient(circle at 50% 12%, rgba(50,72,111,.12), transparent 42%), #090d13;
    transition: background .22s ease;
  }
  .viewport.is-panning { cursor: grabbing; }
  .viewport::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 130px 22px rgba(0,0,0,.32); }
  .viewport-grid {
    position: absolute; inset: 0; pointer-events: none; opacity: .84;
    background-image: radial-gradient(circle, rgba(101,120,148,.26) 1px, transparent 1px);
    background-size: 24px 24px; mask-image: linear-gradient(to bottom, black, rgba(0,0,0,.67) 76%, transparent);
  }
  .viewport.is-light { background: #f8fafc; cursor: default; }
  .viewport.is-light::after { box-shadow: inset 0 0 90px 10px rgba(15,23,42,.05); }
  .viewport.is-light .viewport-grid { background-image: radial-gradient(circle, #d7e0eb 1px, transparent 1px); mask-image: none; opacity: .9; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .world.page-enter { animation: pageEnter .24s cubic-bezier(.2,.7,.2,1) both; }
  .viewport.is-light .world { animation: none; }

  .canvas-status { position: absolute; top: 18px; left: 21px; z-index: 8; pointer-events: none; }
  .canvas-kicker { color: var(--accent); font-size: 10.5px; letter-spacing: .03em; }
  .canvas-title { margin-top: 5px; font-size: 18px; font-weight: 720; letter-spacing: .01em; }
  .canvas-sub { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
  .canvas-sub kbd { border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; font-family: var(--mono); color: var(--muted); }
  .viewport.is-light .canvas-status { display: none; }
  .detail-api-row {
    width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 8px; padding: 8px 9px;
    border: 1px solid var(--line-soft); border-radius: 7px; background: rgba(255,255,255,.018);
    color: #d6e1ef; cursor: pointer; text-align: left;
  }
  .detail-api-row + .detail-api-row { margin-top: 5px; }
  .detail-api-row:hover { border-color: rgba(96,165,250,.48); background: rgba(96,165,250,.07); }
  .detail-api-kind { padding-top: 1px; color: #879ab1; font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
  .detail-api-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .detail-api-name { min-width: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }
  .detail-api-note { color: #9fb0c5; font-family: var(--font); font-size: 11.5px; line-height: 1.48; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .detail-api-meta { color: #73859d; font-family: var(--mono); font-size: 10px; line-height: 1.4; overflow-wrap: anywhere; }
  .detail-api-entry { color: #8bdc64; font-family: var(--mono); font-size: 10px; }
  .detail-api-badge { align-self: start; color: #8fa2ba; border: 1px solid var(--line-soft); border-radius: 4px; padding: 2px 5px; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .api-provider { margin-top: 10px; }
  .api-provider + .api-provider { border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .api-provider-head { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; color: #c7d6e9; flex-wrap: wrap; }
  .api-provider-kind { color: #7f93ac; font-family: var(--mono); font-size: var(--ui-caption); letter-spacing: .02em; }
  .api-provider-head b { font-family: var(--mono); font-size: 11.5px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .api-provider-head em { margin-left: auto; color: #8bdc64; font-family: var(--mono); font-size: 10px; font-style: normal; }

  .world-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .graph-edge {
    fill: none; stroke: var(--edge); stroke-width: 1.35; opacity: .56; vector-effect: non-scaling-stroke;
    transition: opacity .15s ease, stroke .15s ease, stroke-width .15s ease;
  }
  .graph-edge.is-highlight { stroke: #9dc5ff; stroke-width: 2.05; opacity: 1; filter: drop-shadow(0 0 4px rgba(110,168,255,.32)); }
  .graph-edge.is-dim { opacity: .07; }
  .graph-edge.is-search-dim { opacity: .06; }
  .graph-edge.is-hidden { display: none; }

  .node-card {
    position: absolute; user-select: none; touch-action: none;
    transition: border-color .16s ease, box-shadow .16s ease, opacity .16s ease, transform .16s ease;
  }
  .module-node {
    --mc: #f59e0b; --mc-rgb: 245,158,11;
    border: 1px solid rgba(var(--mc-rgb), .48); border-radius: 13px; overflow: hidden;
    background: linear-gradient(180deg, rgba(var(--mc-rgb), .10), rgba(var(--mc-rgb), .022) 28%, rgba(255,255,255,.010)), #0e141d;
    box-shadow: 0 12px 28px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.045); z-index: 3;
  }
  .module-node::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: linear-gradient(90deg, rgb(var(--mc-rgb)), rgba(var(--mc-rgb), .05));
  }
  .module-node:hover, .module-node.is-selected { border-color: rgba(var(--mc-rgb), .88); box-shadow: 0 16px 36px rgba(0,0,0,.42), 0 0 0 3px rgba(var(--mc-rgb), .09), 0 0 30px rgba(var(--mc-rgb), .12); }
  .module-node.is-dragging { z-index: 40; cursor: grabbing; transition: none; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 3px rgba(var(--mc-rgb), .14); }
  .module-node.is-search-dim { opacity: .18; }
  .module-header { padding: 13px 14px 10px; cursor: move; touch-action: none; }
  .module-title-row { display: flex; align-items: center; gap: 8px; }
  .module-dot { width: 8px; height: 8px; border-radius: 3px; background: rgb(var(--mc-rgb)); box-shadow: 0 0 11px rgba(var(--mc-rgb), .7); flex: 0 0 auto; }
  .module-kind { color: rgba(var(--mc-rgb), .90); font-size: 7px; letter-spacing: .12em; font-family: var(--mono); }
  .module-title { color: #f1f5fb; font-size: 14px; font-weight: 680; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .module-actions { margin-left: auto; display: flex; gap: 4px; }
  .mini-action {
    width: 24px; height: 24px; border-radius: 5px; border: 1px solid rgba(var(--mc-rgb), .24);
    background: rgba(var(--mc-rgb), .06); color: rgba(var(--mc-rgb), .88);
    display: grid; place-items: center; cursor: pointer; font-size: 11px; transition: .16s ease;
  }
  .mini-action:hover { background: rgba(var(--mc-rgb), .14); border-color: rgba(var(--mc-rgb), .48); }
  .module-note {
    color: #9dabbd; font-size: 9.5px; line-height: 1.55; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 470px;
  }
  .module-api-section { margin-top: 10px; }
  .module-api-heading { display: flex; align-items: center; gap: 6px; color: #7f93ac; font-family: var(--mono); font-size: 7px; letter-spacing: .13em; }
  .module-api-heading b { color: rgba(var(--mc-rgb), .92); font-weight: 650; letter-spacing: 0; }
  .module-api-chips { display: flex; align-items: center; gap: 4px; margin-top: 5px; overflow: hidden; min-height: 18px; }
  .module-api-chip {
    flex: 0 1 auto; max-width: 150px; border: 1px solid rgba(var(--mc-rgb), .30); border-radius: 4px;
    padding: 2px 6px; color: #c5d8ef; background: rgba(var(--mc-rgb), .09); font-family: var(--mono);
    font-size: 7px; line-height: 1.35; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .module-api-chip:hover { border-color: rgba(var(--mc-rgb), .70); background: rgba(var(--mc-rgb), .17); color: #f0f6ff; }
  .module-api-chip.is-entry { border-color: rgba(139,220,100,.42); color: #d7f4c9; background: rgba(139,220,100,.08); }
  .module-api-chip.is-abstract { border-style: dashed; }
  .module-api-chip.is-protocol { border-color: rgba(167,139,250,.46); color: #ded1ff; background: rgba(167,139,250,.10); }
  .module-api-chip.more { flex: 0 0 auto; color: #8d9bae; border-color: var(--line-soft); background: rgba(255,255,255,.025); }
  .module-api-empty { color: #748398; font-size: 7.5px; font-family: var(--mono); }
  .module-metrics { display: flex; align-items: center; gap: 9px; margin-top: 8px; color: #748398; font-family: var(--mono); font-size: 7px; }
  .module-metrics .has-apis { color: rgba(var(--mc-rgb), .82); }
  .graph-edge.kind-composition { stroke: #f59e0b; stroke-dasharray: 7 6; opacity: .38; }
  .graph-edge.kind-call_path { stroke: #7dd3fc; stroke-dasharray: 2 4; opacity: .50; }
  .graph-edge.is-low { stroke-width: 1.05; }
  .flow-empty { position: absolute; left: 70px; top: 120px; width: 520px; padding: 24px; border: 1px dashed var(--line); border-radius: 14px; background: rgba(14,21,31,.9); }
  .flow-empty h2 { margin: 7px 0 0; font-size: 18px; }
  .flow-empty p { color: var(--muted); font-size: 10px; line-height: 1.6; }

  .function-node {
    --mc: #f59e0b; --mc-rgb: 245,158,11; width: 210px; height: 98px; padding: 12px 13px;
    border: 1px solid rgba(var(--mc-rgb), .44); border-radius: 10px; cursor: grab;
    background: linear-gradient(180deg, rgba(var(--mc-rgb), .095), rgba(var(--mc-rgb), .018) 40%, rgba(255,255,255,.012)), #0f151f;
    box-shadow: 0 9px 22px rgba(0,0,0,.29), inset 0 1px 0 rgba(255,255,255,.04); z-index: 3;
  }
  .function-node::before { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 2px; border-radius: 2px; background: rgb(var(--mc-rgb)); opacity: .9; }
  .function-node:hover, .function-node.is-selected { border-color: rgba(var(--mc-rgb), .86); box-shadow: 0 12px 28px rgba(0,0,0,.36), 0 0 0 3px rgba(var(--mc-rgb), .08), 0 0 25px rgba(var(--mc-rgb), .11); }
  .function-node.is-dragging { cursor: grabbing; z-index: 30; transition: none; }
  .function-node.is-search-dim { opacity: .17; }
  .fn-node-top { display: flex; align-items: center; gap: 6px; }
  .fn-node-icon { width: 17px; height: 17px; border-radius: 4px; display: grid; place-items: center; background: rgba(var(--mc-rgb), .12); color: rgb(var(--mc-rgb)); font-family: var(--mono); font-size: 9px; }
  .fn-node-kind { color: rgba(var(--mc-rgb), .82); font-size: 7px; letter-spacing: .10em; font-family: var(--mono); }
  .fn-node-name { margin-top: 7px; color: #f1f5fb; font-family: var(--mono); font-size: 13px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fn-node-note { margin-top: 5px; color: #8d9bae; font-size: 8.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .class-node {
    --mc: #60a5fa; --mc-rgb: 96,165,250; width: 280px; height: 150px; padding: 13px 14px;
    border: 1px solid rgba(var(--mc-rgb), .54); border-radius: 12px; cursor: grab;
    background:
      linear-gradient(135deg, rgba(var(--mc-rgb), .14), rgba(var(--mc-rgb), .035) 48%, rgba(255,255,255,.012)),
      #0e1622;
    box-shadow: 0 10px 26px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05); z-index: 4;
  }
  .class-node::before {
    content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 3px;
    border-radius: 3px; background: rgb(var(--mc-rgb)); opacity: .95;
  }
  .class-node.is-abstract { border-style: dashed; background: linear-gradient(135deg, rgba(var(--mc-rgb), .09), rgba(255,255,255,.012)), #0d141e; }
  .class-node:hover, .class-node.is-selected { border-color: rgba(var(--mc-rgb), .92); box-shadow: 0 13px 30px rgba(0,0,0,.39), 0 0 0 3px rgba(var(--mc-rgb), .08), 0 0 26px rgba(var(--mc-rgb), .12); }
  .class-node.is-dragging { cursor: grabbing; z-index: 40; transition: none; }
  .class-node.is-search-dim { opacity: .17; }
  .class-node-top { display: flex; align-items: center; gap: 6px; }
  .class-node-icon { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: rgba(var(--mc-rgb), .14); color: rgb(var(--mc-rgb)); font-family: var(--mono); font-size: 9px; font-weight: 700; }
  .class-node-kind { color: rgba(var(--mc-rgb), .88); font-size: 7px; letter-spacing: .11em; font-family: var(--mono); }
  .class-node-count { margin-left: auto; color: #9aa8ba; font-family: var(--mono); font-size: 7.5px; }
  .class-node-name { margin-top: 8px; color: #f1f5fb; font-family: var(--mono); font-size: 14px; font-weight: 680; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Function-flow canvas follows the operating system color scheme. */
  .viewport.is-light .world { background: transparent; }

  @media (prefers-color-scheme: dark) {
    :root {
      --method-bg: #090d13;
      --method-glow: rgba(59,130,246,.12);
      --method-text: #cbd8e8;
      --method-title: #f1f5fb;
      --method-muted: #8fa2ba;
      --method-muted-2: #64748b;
      --method-border: #263142;
      --method-border-soft: rgba(148,163,184,.14);
      --method-panel: #111720;
      --method-panel-hover: #172232;
      --method-accent: #c5e0ff;
      --method-warning: #ffb454;
      --method-shadow: 0 10px 30px rgba(0,0,0,.30);
      --method-source-bg: #070b11;
      --method-source-text: #dbeafe;
      --method-source-muted: #64748b;
    }
    .viewport.is-light {
      background:
        radial-gradient(circle at 50% 12%, rgba(50,72,111,.12), transparent 42%),
        #090d13;
    }
    .viewport.is-light::after { box-shadow: inset 0 0 130px 22px rgba(0,0,0,.32); }
    .viewport.is-light .viewport-grid {
      background-image: radial-gradient(circle, rgba(101,120,148,.26) 1px, transparent 1px);
      mask-image: linear-gradient(to bottom, black, rgba(0,0,0,.67) 76%, transparent);
      opacity: .84;
    }
    .viewport.is-light .graph-legend {
      background: rgba(11,16,23,.82);
      border-color: var(--line-soft);
      color: var(--muted);
    }
    .viewport.is-light .legend-line { background: #64748b; }
    .viewport.is-light .legend-line::after { border-left-color: #64748b; }
    .viewport.is-light .zoombar {
      background: rgba(11,16,23,.82);
      border-color: var(--line-soft);
    }
    .viewport.is-light .zoombar button { color: var(--muted); }
    .viewport.is-light .zoombar button:hover { color: var(--ink); background: rgba(255,255,255,.06); }
    .viewport.is-light .zoom-value { color: var(--muted-2); }
  }

  /* Method detail page (P1.5: source + semantics + call graph). */
  .viewport.is-detail { cursor: default; background: var(--method-bg); }
  .viewport.is-detail .viewport-grid { display: none; }
  .viewport.is-detail .canvas-status { display: none; }
  .method-page {
    position: absolute; inset: 0; overflow: auto; padding: 26px 30px 56px;
    color: var(--method-text); background:
      radial-gradient(circle at 14% 0%, var(--method-glow), transparent 30%),
      var(--method-bg);
    font-family: var(--font);
  }
  .method-page-head { max-width: 1260px; margin: 0 auto 20px; padding: 4px 2px 0; }
  .method-page-title { margin: 6px 0 0; font-family: var(--mono); font-size: 28px; line-height: 1.15; letter-spacing: -.04em; color: var(--method-title); }
  .method-page-title span { color: var(--method-muted-2); font-weight: 400; }
  .method-signature { margin-top: 11px; padding: 10px 12px; display: inline-block; border: 1px solid var(--method-border); border-radius: 7px; background: var(--method-panel); color: var(--method-text); font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  .method-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .method-badge { padding: 3px 8px; border: 1px solid var(--method-border); border-radius: 999px; background: var(--method-panel); color: var(--method-muted); font-family: var(--mono); font-size: 10px; letter-spacing: .02em; }
  .method-location { margin-top: 10px; color: var(--method-muted); font-family: var(--mono); font-size: 11px; }
  .method-page-grid { max-width: 1260px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
  .method-source-panel, .method-calls-panel { border: 1px solid var(--method-border); border-radius: 11px; background: var(--method-panel); box-shadow: var(--method-shadow); overflow: hidden; }
  .method-panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--method-border-soft); color: var(--method-text); font-size: var(--ui-meta); font-weight: 700; letter-spacing: .02em; }
  .method-panel-heading em { color: var(--method-muted-2); font-style: normal; font-family: var(--mono); font-size: 10px; font-weight: 400; letter-spacing: 0; }
  .method-source { max-height: calc(100vh - 300px); overflow: auto; padding: 9px 0 14px; background: var(--method-source-bg); }
  .method-source-line { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: start; min-height: 24px; border-left: 2px solid transparent; padding: 0 12px 0 0; }
  .method-source-line.is-call-site { border-left-color: #3b82f6; background: rgba(59,130,246,.13); }
  .method-source-ln { padding: 4px 11px 4px 10px; color: var(--method-source-muted); text-align: right; font-family: var(--mono); font-size: 10px; line-height: 1.65; user-select: none; }
  .method-source-code { padding: 4px 8px 4px 0; color: var(--method-source-text); font-family: var(--mono); font-size: 12px; line-height: 1.65; white-space: pre; }
  .method-source-call { align-self: start; margin: 4px 9px 0 0; padding: 2px 6px; border-radius: 4px; background: rgba(59,130,246,.2); color: #93c5fd; font-family: var(--mono); font-size: 9.5px; }
  .method-calls-panel { display: flex; flex-direction: column; gap: 12px; background: transparent; border: 0; box-shadow: none; overflow: visible; }
  .method-calls-panel > section { border: 1px solid var(--method-border); border-radius: 10px; background: var(--method-panel); overflow: hidden; box-shadow: var(--method-shadow); }
  .method-call-item { width: 100%; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 8px; padding: 9px 11px; border: 0; border-bottom: 1px solid var(--method-border-soft); background: var(--method-panel); color: var(--method-text); text-align: left; cursor: pointer; }
  .method-call-item:last-child { border-bottom: 0; }
  .method-call-item:hover { background: var(--method-panel-hover); }
  .method-call-item.is-static { cursor: default; }
  .method-call-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--method-accent); font-family: var(--mono); font-size: 11px; }
  .method-call-meta { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--method-muted-2); font-family: var(--mono); font-size: 10px; }
  .method-call-kind { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--method-muted); font-family: var(--mono); font-size: 10px; }
  .method-call-item.is-static .method-call-kind { color: var(--method-warning); }
  .method-call-empty { padding: 14px 12px; color: var(--method-muted-2); font-size: 11.5px; }
  @media (max-width: 980px) {
    .method-page-grid { grid-template-columns: 1fr; }
    .method-source { max-height: none; }
    .method-calls-panel { display: grid; grid-template-columns: 1fr 1fr; }
  }

  .type-field-chip.more { color: #94a7bd; border-color: var(--line-soft); background: rgba(255,255,255,.025); }
  .type-field-empty { color: #748398; font-family: var(--mono); font-size: 10.5px; }
  .type-field-list { display: flex; flex-direction: column; gap: 4px; }
  .type-field-row {
    display: grid; grid-template-columns: minmax(70px, 1fr) minmax(70px, 1.1fr) minmax(70px, 1.1fr) auto;
    align-items: center; gap: 7px; border: 1px solid var(--line-soft); border-radius: 5px;
    padding: 6px 7px; background: rgba(255,255,255,.016); font-family: var(--mono); font-size: 10.5px;
  }
  .type-field-name { color: #dce9f8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-field-annotation { color: #91b8e8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-field-default { color: #b7d8a1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-field-kind { color: #7f93ac; font-size: 10px; }
  .module-composition { display: flex; flex-direction: column; gap: 5px; }
  .composition-row { display: flex; align-items: center; gap: 7px; border-bottom: 1px solid var(--line-soft); padding: 4px 1px; }
  .composition-row:last-child { border-bottom: 0; }
  .composition-count { color: #8bdc64; font-family: var(--mono); font-size: 10.5px; }
  .composition-ids { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
  .composition-ids code { color: #9fb4cc; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
  .composition-ids em { color: #7f93ac; font-family: var(--mono); font-size: 10px; font-style: normal; }
  .api-role-group { margin-top: 10px; }
  .api-role-group + .api-role-group { border-top: 1px solid var(--line-soft); padding-top: 8px; }
  .api-role-heading { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .api-role-heading span { color: #7f93ac; font-family: var(--mono); font-size: 10.5px; }

/* P3 type hierarchy and polymorphic call surfaces */
.class-hierarchy {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.hierarchy-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  align-items: start;
  gap: 8px;
  font-size: 11px;
}
.hierarchy-row > span {
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .02em;
  padding-top: 2px;
}
.hierarchy-row > div {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.hierarchy-row code,
.method-call-candidates code {
  color: var(--text);
  background: rgba(110, 168, 255, .12);
  border: 1px solid rgba(110, 168, 255, .22);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 10.5px;
}
.hierarchy-row.is-unresolved code {
  color: var(--warn, #fbbf24);
  background: rgba(251, 191, 36, .08);
  border-color: rgba(251, 191, 36, .2);
}
.class-hierarchy-empty {
  color: var(--text-dim);
  font-size: 11px;
}
.detail-api-badge.is-inherited {
  color: #93c5fd;
  border-color: rgba(147, 197, 253, .35);
}
.detail-api-badge.is-override {
  color: #fbbf24;
  border-color: rgba(251, 191, 36, .35);
}
.method-call-item.is-polymorphic {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 8px;
  border-left: 2px solid rgba(251, 191, 36, .45);
}
.method-call-candidates {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.method-call-kind {
  white-space: nowrap;
}

/* P4 user surfaces and structural relation facts */
.user-surface-track {
  display: flex;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 5px;
  overflow: visible;
}
.user-surface-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  max-width: 100%;
  padding: 3px 6px;
  border: 1px solid rgba(34, 211, 238, .24);
  border-radius: 5px;
  background: rgba(34, 211, 238, .06);
  font-family: var(--mono);
  font-size: 10.5px;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.user-surface-chip b { color: #67e8f9; font-weight: 600; }
.user-surface-chip span { color: var(--text-dim); }
.user-surface-chip.kind-network_endpoint,
.user-surface-chip.kind-network_client { border-color: rgba(96, 165, 250, .3); }
.user-surface-chip.kind-keyboard_event { border-color: rgba(251, 191, 36, .3); }
.user-surface-chip.kind-file_io { border-color: rgba(134, 239, 172, .3); }
.structural-relations {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.structural-relation-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: 6px 7px;
  border-left: 2px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
}
.structural-relation-main {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 5px;
  min-width: 0;
}
.structural-relation-node {
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.structural-relation-main em {
  flex: 0 0 auto;
  color: #93c5fd;
  font-style: normal;
  font-size: 10px;
}
.structural-relation-arrow {
  flex: 0 0 auto;
  color: var(--text-dim);
}
.structural-relation-source {
  color: var(--text-dim);
  font-size: 10px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* P5.1 bounded execution flow cards with embedded port rows */
.execution-node {
  --mc: #60a5fa;
  --mc-rgb: 96,165,250;
  position: absolute;
  z-index: 4;
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid rgba(var(--mc-rgb), .62);
  border-radius: 13px;
  background:
    linear-gradient(180deg, rgba(var(--mc-rgb), .068), rgba(255, 255, 255, .006) 42%, rgba(255, 255, 255, .003)),
    #10141a;
  box-shadow:
    0 18px 42px rgba(0, 0, 0, .38),
    0 0 0 1px rgba(var(--mc-rgb), .055),
    inset 0 1px 0 rgba(255, 255, 255, .04);
  transition: border-color .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.execution-node::before { display: none; }
.execution-node:hover, .execution-node.is-selected {
  border-color: rgba(var(--mc-rgb), .95);
  box-shadow:
    0 20px 46px rgba(0, 0, 0, .46),
    0 0 0 2px rgba(var(--mc-rgb), .12),
    0 0 26px rgba(var(--mc-rgb), .10),
    inset 0 1px 0 rgba(255, 255, 255, .045);
}
.execution-node.kind-dispatch { border-style: dashed; }
.execution-node.kind-loop {
  background:
    linear-gradient(180deg, rgba(var(--mc-rgb), .075), rgba(255, 255, 255, .006) 42%, rgba(255, 255, 255, .003)),
    #10141a;
}
.execution-node.is-search-dim { opacity: .14; }
.execution-node.is-dim { opacity: .12; }
.execution-node.is-highlight { border-color: rgba(var(--mc-rgb), .98); }

.exec-node-header {
  flex: 0 0 34px;
  height: 34px;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  border-bottom: 1px solid rgba(0, 0, 0, .34);
  background: linear-gradient(90deg, rgba(var(--mc-rgb), .96), rgba(var(--mc-rgb), .58));
  color: #111318;
}
.exec-node-icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 5px;
  background: rgba(0, 0, 0, .20);
  color: #101318;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
}
.exec-node-kind {
  flex: 0 0 auto;
  color: #101318;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .07em;
}
.exec-node-module {
  margin-left: auto;
  min-width: 0;
  overflow: hidden;
  color: rgba(8, 12, 18, .63);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: .03em;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.exec-node-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 9px 11px;
  overflow: hidden;
}
.exec-copy {
  padding-bottom: 7px;
  border-bottom: 1px solid rgba(148, 163, 184, .095);
}
.execution-node .exec-node-label {
  margin: 0;
  overflow: hidden;
  color: #f3f7fd;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.24;
  letter-spacing: -.015em;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.execution-node .exec-node-note {
  display: -webkit-box;
  margin-top: 4px;
  overflow: hidden;
  color: #9aa8ba;
  font-size: 8.5px;
  line-height: 1.3;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.execution-node .exec-node-meta {
  margin-top: 4px;
  overflow: hidden;
  color: rgba(var(--mc-rgb), .82);
  font-family: var(--mono);
  font-size: 8px;
  line-height: 1.35;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.exec-port-grid {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  column-gap: 18px;
  padding-top: 10px;
}
.exec-port-side {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}
.exec-port-side.is-left { align-items: flex-start; }
.exec-port-side.is-right { align-items: flex-end; }
.exec-port-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 21px;
  max-width: 100%;
  color: #c8d4e2;
}
.exec-port-item.is-right {
  flex-direction: row-reverse;
  text-align: right;
}
.exec-port-item::before {
  content: "";
  position: absolute;
  top: 50%;
  width: 12px;
  height: 1px;
  background: currentColor;
  opacity: .22;
  transform: translateY(-50%);
}
.exec-port-item.is-left::before { left: -12px; }
.exec-port-item.is-right::before { right: -12px; }
.exec-port-symbol {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 9px;
  height: 9px;
  border: 1px solid #080b10;
  background: currentColor;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .06);
}
.exec-port-symbol.shape-circle { border-radius: 50%; }
.exec-port-symbol.shape-triangle { border-radius: 2px; transform: rotate(45deg); }
.exec-port-symbol.shape-diamond { border-radius: 1px; transform: rotate(45deg); }
.exec-port-item.port-in { color: #c8d4e2; }
.exec-port-item.port-out { color: #c8d4e2; }
.exec-port-item.port-true { color: #8ed15b; }
.exec-port-item.port-false { color: #f06474; }
.exec-port-item.port-case { color: #60a5fa; }
.exec-port-item.port-default { color: #8b93a3; }
.exec-port-item.port-loop_body { color: #38bdf8; }
.exec-port-item.port-loop_complete { color: #94a3b8; }
.exec-port-item.port-dispatch { color: #a78bfa; }
.exec-port-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.exec-port-item.is-right .exec-port-copy { align-items: flex-end; }
.exec-port-copy b {
  overflow: hidden;
  color: #dce6f3;
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 620;
  line-height: 1.25;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.exec-port-copy small {
  overflow: hidden;
  color: #6d7a8e;
  font-family: var(--mono);
  font-size: 7px;
  line-height: 1.25;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.exec-port-empty { min-height: 21px; }

.exec-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(148, 163, 184, .085);
  color: #667489;
  font-family: var(--mono);
  font-size: 7.5px;
  line-height: 1.3;
  overflow: hidden;
}
.exec-pill {
  flex: 0 0 auto;
  max-width: 100%;
  overflow: hidden;
  padding: 2px 6px;
  border: 1px solid rgba(var(--mc-rgb), .19);
  border-radius: 999px;
  background: rgba(var(--mc-rgb), .05);
  color: rgba(var(--mc-rgb), .78);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.execution-edge {
  fill: none;
  stroke: #65738a;
  stroke-width: 1.35;
  opacity: .64;
  vector-effect: non-scaling-stroke;
  pointer-events: stroke;
  transition: opacity .15s ease, stroke .15s ease, stroke-width .15s ease;
}
.execution-edge.kind-true { stroke: #8bdc64; }
.execution-edge.kind-false { stroke: #ff707b; }
.execution-edge.kind-case { stroke: #60a5fa; }
.execution-edge.kind-default { stroke: #94a3b8; }
.execution-edge.kind-loop_body { stroke: #38bdf8; }
.execution-edge.kind-loop_complete { stroke: #94a3b8; }
.execution-edge.is-highlight { stroke: #c8e2ff; stroke-width: 2.2; opacity: 1; filter: drop-shadow(0 0 4px rgba(110,168,255,.36)); }
.execution-edge.is-dim { opacity: .06; }
.execution-edge.is-search-dim { opacity: .06; }
.execution-edge-label { display: none; }

/* P10 one-level interface drilldown */
.execution-node .exec-node-interface-hint {
  margin-top: 5px;
  overflow: hidden;
  color: rgba(var(--mc-rgb), .92);
  font-family: var(--mono);
  font-size: 7.5px;
  line-height: 1.35;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.exec-drilldown-l1 {
  position: absolute;
  right: 8px;
  bottom: 7px;
  z-index: 3;
  padding: 3px 7px;
  border: 1px solid rgba(var(--mc-rgb), .40);
  border-radius: 999px;
  background: rgba(var(--mc-rgb), .14);
  color: #f3f7fd;
  font-family: var(--mono);
  font-size: 7.5px;
  font-weight: 720;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 0 3px 14px rgba(0, 0, 0, .22);
}
.exec-drilldown-l1:hover {
  background: rgba(var(--mc-rgb), .25);
  border-color: rgba(var(--mc-rgb), .72);
}
.exec-interface-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.exec-interface-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  max-width: 100%;
  padding: 4px 7px;
  border: 1px solid rgba(148, 163, 184, .18);
  border-radius: 7px;
  background: rgba(148, 163, 184, .06);
  color: #c9d6e5;
  font-family: var(--mono);
  font-size: 9px;
}
.exec-interface-chip b {
  color: #8ebcff;
  font-size: 8px;
  font-weight: 700;
}

/* P10.2 control-arm semantics without statement nodes */
.execution-node .exec-arm-summaries {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px dashed rgba(148, 163, 184, .11);
}
.exec-arm-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
  color: #9eacbd;
  font-family: var(--mono);
  font-size: 7.5px;
  line-height: 1.32;
}
.exec-arm-row b {
  flex: 0 0 auto;
  color: rgba(var(--mc-rgb), .92);
  font-weight: 700;
}
.exec-arm-row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.execution-edge-note {
  position: absolute;
  z-index: 4;
  max-width: 220px;
  overflow: hidden;
  padding: 2px 5px;
  border: 1px solid rgba(148, 163, 184, .18);
  border-radius: 5px;
  background: rgba(9, 13, 19, .86);
  color: #aab7c7;
  font-family: var(--mono);
  font-size: 7px;
  line-height: 1.25;
  text-overflow: ellipsis;

  pointer-events: none;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .22);
}
.exec-arm-detail {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.exec-arm-detail-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 6px;
  border: 1px solid rgba(148, 163, 184, .14);
  border-radius: 6px;
  background: rgba(148, 163, 184, .04);
  color: #c4d0df;
  font-family: var(--mono);
  font-size: 9px;
  line-height: 1.35;
}
.exec-arm-detail-row b {
  flex: 0 0 auto;
  color: #8ebcff;
  font-weight: 700;
}
.exec-drilldown-l1.is-auto {
  border-style: dashed;
}

</style>

<script>
window.__ARCHMAP_ERRORS__=[];

      executions: {},

  function normalizeOverride(value) {

  let detailResizeDrag = null;

    detailResizeDrag = { pointerId: event.pointerId, startX: event.clientX, startWidth: width };
    try {
      detailResizer.setPointerCapture(event.pointerId);
    } catch (error) {

    }

  detailResizer.addEventListener("pointermove", event => {
    if (!detailResizeDrag || event.pointerId !== detailResizeDrag.pointerId) return;
    const next = detailResizeDrag.startWidth + (detailResizeDrag.startX - event.clientX);
    applyDetailPanelWidth(next, { persist: false, refit: true });
  });
  const finishDetailResize = event => {
    if (!detailResizeDrag) return;
    if (event?.pointerId !== undefined && event.pointerId !== detailResizeDrag.pointerId) return;
    const width = detailPanel.getBoundingClientRect().width;

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[ch]);
  }

  function escapeXml(value) {
    return escapeHtml(value).replaceAll("'", "&apos;");
  }

  function truncate(value, max) {
    const text = String(value ?? "").replace(/\s+/g, " ").trim();
    return text.length > max ? text.slice(0, Math.max(0, max - 1)) + "…" : text;
  }

  function cssEscape(value) {
    if (window.CSS && typeof window.CSS.escape === "function") return window.CSS.escape(String(value));
    return String(value).replace(/["\\]/g, "\\$&");
  }

  function rgbFromHex(hex) {
    const value = String(hex || "#6ea8ff").replace("#", "");
    const full = value.length === 3 ? value.split("").map(ch => ch + ch).join("") : value.padEnd(6, "0").slice(0, 6);
    const num = parseInt(full, 16);
    return `${(num >> 16) & 255},${(num >> 8) & 255},${num & 255}`;
  }

  function showToast(message) {

    showToast.timer = setTimeout(() => toastEl.classList.remove("is-visible"), 1800);
  }

  function parseRoute() {
    const hash = location.hash.replace(/^#\/?/, "");
    const parts = hash.split("/").filter(Boolean).map(part => {
      try { return decodeURIComponent(part); } catch (error) { return part; }
    });
    if (parts[0] === "module" && parts[1]) {
      if (parts[2] === "function" && parts[3]) {
        return { kind: "function", moduleId: parts[1], functionId: parts[3] };
      }
      return { kind: "module", moduleId: parts[1] };
    }
    if (parts[0] === "flow") {
      if (parts[2] === "scope" && parts[3]) {
        return { kind: "scope", flowId: parts[1] || null, nodeId: parts[3] };
      }
      if (parts[2] === "dispatch" && parts[3]) {
        return {
          kind: "dispatch",
          flowId: parts[1] || null,
          nodeId: parts[3],
          candidateScopeId: parts[4] === "candidate" && parts[5] ? parts[5] : null,
        };
      }
      return { kind: "flow", flowId: parts[1] || null };
    }
    return { kind: "project" };
  }

  function routeHash(route) {
    if (route.kind === "module") return `#/module/${encodeURIComponent(route.moduleId)}`;
    if (route.kind === "function") {
      return `#/module/${encodeURIComponent(route.moduleId)}/function/${encodeURIComponent(route.functionId)}`;
    }
    if (route.kind === "flow") {
      return route.flowId ? `#/flow/${encodeURIComponent(route.flowId)}` : "#/flow";
    }
    if (route.kind === "scope") {
      return `#/flow/${encodeURIComponent(route.flowId)}/scope/${encodeURIComponent(route.nodeId)}`;
    }
    if (route.kind === "dispatch") {
      const base = `#/flow/${encodeURIComponent(route.flowId)}/dispatch/${encodeURIComponent(route.nodeId)}`;
      return route.candidateScopeId
        ? `${base}/candidate/${encodeURIComponent(route.candidateScopeId)}`
        : base;
    }
    return "#/project";
  }

  function navigate(route, push = true) {
    const nextHash = routeHash(route);
    if (push && location.hash !== nextHash) history.pushState(route, "", nextHash);
    else if (!push) history.replaceState(route, "", nextHash);
    state.route = route;
    renderRoute();
  }

  function focusPage() {
    const nodes = [...world.querySelectorAll(".node-card")];
    const edges = [...world.querySelectorAll(".graph-edge, .macro-edge, .execution-edge")];
    const focusUid = state.selectedUid || state.hoveredUid;
    nodes.forEach(node => node.classList.toggle("is-selected", node.dataset.uid === focusUid));
    if (!focusUid) {
      nodes.forEach(node => node.classList.remove("is-dim", "is-highlight"));
      edges.forEach(edge => edge.classList.remove("is-dim", "is-highlight"));
      return;
    }
    // Capability cards are siblings, not a dependency neighbourhood.
    if (state.pageKind === "project") {
      nodes.forEach(node => node.classList.remove("is-dim", "is-highlight"));
      edges.forEach(edge => edge.classList.remove("is-dim", "is-highlight"));
      return;
    }
    const isFlowPage = Boolean(world.querySelector(".execution-node"));
    const neighborUids = new Set([focusUid]);
    state.pageEdges.forEach(edge => {
      if (edge.from === focusUid || edge.to === focusUid) {
        neighborUids.add(edge.from);
        neighborUids.add(edge.to);
      }
    });
    nodes.forEach(node => {
      const uid = node.dataset.uid;
      node.classList.toggle("is-dim", !neighborUids.has(uid));
      node.classList.toggle("is-highlight", uid === focusUid);
    });
    edges.forEach(edge => {
      const highlighted = edge.dataset.from === focusUid || edge.dataset.to === focusUid;
      edge.classList.toggle("is-highlight", highlighted);
      if (isFlowPage) edge.classList.remove("is-dim");
      else edge.classList.toggle("is-dim", !highlighted);
    });
  }

  function selectUid(uid) {
    if (Date.now() < state.suppressClickUntil) return;
    state.selectedUid = uid;
    state.hoveredUid = null;
    focusPage();
    renderSelectionDetail(uid);
  }

  function clearSelection() {
    state.selectedUid = null;
    state.hoveredUid = null;
    focusPage();

  function bindNodeHover(element, uid) {

    element.addEventListener("mouseleave", () => { state.hoveredUid = null; focusPage(); });
  }

  function applyTransform() {
    world.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    zoomValue.textContent = `${Math.round(state.scale * 100)}%`;
  }

  function contentBounds() {
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    if (state.positions) {
      state.positions.forEach((position, nodeId) => {
        const size = state.sizes?.get(nodeId) || { w: position.w || 190, h: position.h || 96 };
        const x = Number(position.x) || 0;
        const y = Number(position.y) || 0;
        const w = Number(size.w) || 190;
        const h = Number(size.h) || 96;
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x + w);
        maxY = Math.max(maxY, y + h);
      });
    }
    if (!Number.isFinite(minX)) {
      return { minX: 0, minY: 0, maxX: 900, maxY: 640, width: 900, height: 640 };
    }
    return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
  }

  function updateWorldExtent(minWidth = 900, minHeight = 640, pad = 90) {
    const bounds = contentBounds();
    const width = Math.max(minWidth, bounds.maxX + pad);
    const height = Math.max(minHeight, bounds.maxY + pad);
    const svgX = bounds.minX - pad;
    const svgY = bounds.minY - pad;
    const svgWidth = Math.max(1, bounds.width + pad * 2);
    const svgHeight = Math.max(1, bounds.height + pad * 2);
    world.style.width = `${width}px`;
    world.style.height = `${height}px`;
    const svg = world.querySelector(".world-edges");
    if (svg) {
      svg.style.left = `${svgX}px`;
      svg.style.top = `${svgY}px`;
      svg.setAttribute("width", String(svgWidth));
      svg.setAttribute("height", String(svgHeight));
      svg.setAttribute("viewBox", `${svgX} ${svgY} ${svgWidth} ${svgHeight}`);
    }
    return { width, height, ...bounds };
  }

  function overlayTopPadding(fallback = 122) {
    const panels = [flowPicker].filter(panel => panel?.classList.contains("is-visible"));
    if (!panels.length) return fallback;
    const viewportRect = viewport.getBoundingClientRect();
    const bottom = Math.max(...panels.map(panel => panel.getBoundingClientRect().bottom - viewportRect.top));
    return Math.max(fallback, bottom + 26);
  }

  function fitView(animate = false) {
    const bounds = contentBounds();
    const rect = viewport.getBoundingClientRect();
    const padX = 58;
    const basePadTop = state.pageKind === "module" ? 64 : state.pageKind === "method" ? 26 : state.pageKind === "flow" ? 72 : 64;
    const padTop = overlayTopPadding(basePadTop);
    const padBottom = 46;
    const availableW = rect.width - padX * 2;
    const availableH = rect.height - padTop - padBottom;
    const scale = Math.min(
      availableW / Math.max(1, bounds.width),
      availableH / Math.max(1, bounds.height),
      1
    );
    const minScale = state.pageKind === "method" ? .5 : .2;
    state.scale = Math.max(minScale, Math.min(1, scale));
    state.x = bounds.width * state.scale <= availableW
      ? (rect.width - bounds.width * state.scale) / 2 - bounds.minX * state.scale
      : padX - bounds.minX * state.scale;
    state.y = bounds.height * state.scale <= availableH
      ? padTop + (availableH - bounds.height * state.scale) / 2 - bounds.minY * state.scale
      : padTop - bounds.minY * state.scale;
    applyTransform();
  }

  function focusExecutionStart(flow) {
    if (!flow) return;
    const incoming = new Set((flow.edges || []).map(edge => edge.to));
    const entry = (flow.nodes || []).find(node => !incoming.has(node.id)) || flow.nodes[0];
    const pos = entry ? state.positions.get(entry.id) : null;
    if (!pos) return;
    const rect = viewport.getBoundingClientRect();
    const padTop = overlayTopPadding(148);
    state.scale = Math.max(.78, Math.min(1, state.scale));
    state.x = 72 - pos.x * state.scale;
    state.y = padTop - pos.y * state.scale;
    // Keep a little breathing room without hiding the whole graph offscreen.
    if (rect.width > 900) state.x += 18;
    applyTransform();
  }

  function screenToWorld(clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    return { x: (clientX - rect.left - state.x) / state.scale, y: (clientY - rect.top - state.y) / state.scale };
  }

  function zoomAt(factor, clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    const px = clientX == null ? rect.width / 2 : clientX - rect.left;
    const py = clientY == null ? rect.height / 2 : clientY - rect.top;
    const oldScale = state.scale;
    const nextScale = Math.max(.2, Math.min(2.4, oldScale * factor));
    const wx = (px - state.x) / oldScale;
    const wy = (py - state.y) / oldScale;
    state.scale = nextScale;
    state.x = px - wx * nextScale;
    state.y = py - wy * nextScale;
    applyTransform();
  }

  function curvePath(from, to) {
    const fromRight = to.x >= from.x;
    const sx = fromRight ? from.x + from.w : from.x;
    const sy = from.y + from.h / 2;
    const tx = fromRight ? to.x : to.x + to.w;
    const ty = to.y + to.h / 2;
    const bend = Math.max(52, Math.min(190, Math.abs(tx - sx) * .46));
    const sign = tx >= sx ? 1 : -1;
    return `M ${sx.toFixed(2)} ${sy.toFixed(2)} C ${(sx + sign * bend).toFixed(2)} ${sy.toFixed(2)} ${(tx - sign * bend).toFixed(2)} ${ty.toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)}`;
  }

  function makeSvg(width, height, className) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", className);

    svg.setAttribute("height", String(height));
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  }

  function attachDrag(handle, element, options) {
    let dragging = false;
    let moved = false;
    let start = null;
    let origin = null;

    handle.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest("button")) return;
      event.preventDefault();
      event.stopPropagation();
      dragging = true;
      moved = false;
      start = { x: event.clientX, y: event.clientY };
      origin = options.getPosition();
      element.classList.add("is-dragging");
      try { handle.setPointerCapture(event.pointerId); } catch (error) {}
    });

    handle.addEventListener("pointermove", event => {
      if (!dragging) return;
      const dx = (event.clientX - start.x) / state.scale;
      const dy = (event.clientY - start.y) / state.scale;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
      moved = true;
      const x = origin.x + dx;
      const y = origin.y + dy;
      options.setPosition(x, y);
      element.style.left = `${x}px`;
      element.style.top = `${y}px`;
      options.onMove?.();
    });

    const finish = event => {
      if (!dragging) return;
      dragging = false;
      element.classList.remove("is-dragging");
      try { handle.releasePointerCapture(event.pointerId); } catch (error) {}
      if (moved) {
        state.suppressClickUntil = Date.now() + 220;
        options.onEnd?.();
      }
    };
    handle.addEventListener("pointerup", finish);
    handle.addEventListener("pointercancel", finish);
  }

      relation.fromClassId === node.id || relation.toClassId === node.id
    );
    if (!relations.length) return `<div class="class-method-empty">暂无类型关系</div>`;
    const short = id => String(id || "").split(".").pop();
    return `<div class="structural-relations">${relations.map(relation => `<div class="structural-relation-row">
      <div class="structural-relation-main">
        <span class="structural-relation-node" title="${escapeHtml(relation.fromClassId || "")}">${escapeHtml(short(relation.fromClassId))}</span>
        <em>${escapeHtml(typeRelationLabel(relation.kind))}</em>
        <span class="structural-relation-arrow">→</span>
        <span class="structural-relation-node" title="${escapeHtml(relation.toClassId || "")}">${escapeHtml(short(relation.toClassId))}</span>
      </div>
      <div class="structural-relation-source">来源：${escapeHtml(relation.source || "—")}</div>
    </div>`).join("")}</div>`;
  }

  function classHierarchyBlock(node) {
    const bases = node.baseClassIds || [];
    const subclasses = node.subclassIds || [];
    const unresolved = node.unresolvedBases || [];
    if (!bases.length && !subclasses.length && !unresolved.length) {
      return `<div class="class-method-empty">无已解析的继承/实现关系</div>`;
    }
    const list = (ids, empty) => ids.length ? ids.map(id => `<code>${escapeHtml(String(id).split(".").pop())}</code>`).join("") : `<span class="class-hierarchy-empty">${empty}</span>`;
    return `<div class="class-hierarchy">
      <div class="hierarchy-row"><span>基类</span><div>${list(bases, "—")}</div></div>
      <div class="hierarchy-row"><span>子类</span><div>${list(subclasses, "—")}</div></div>
      ${unresolved.length ? `<div class="hierarchy-row is-unresolved"><span>未解析</span><div>${unresolved.map(item => `<code>${escapeHtml(item)}</code>`).join("")}</div></div>` : ""}
    </div>`;
  }

  function polymorphicCallList(entries, emptyText) {
    if (!entries || !entries.length) return `<div class="method-call-empty">${escapeHtml(emptyText)}</div>`;
    return entries.map(entry => {
      const candidates = entry.candidates || [];
      const targetNames = candidates.map(id => String(id).split(".").slice(-2).join("."));
      return `<div class="method-call-item is-polymorphic">
        <span class="method-call-name">${escapeHtml(entry.calleeText || entry.qualifiedName || "polymorphic call")}</span>
        <span class="method-call-meta">${escapeHtml(entry.file || "")}:${entry.line || "—"} · ${candidates.length} 个候选</span>
        <span class="method-call-kind">多态</span>
        ${targetNames.length ? `<span class="method-call-candidates">${targetNames.map(name => `<code>${escapeHtml(name)}</code>`).join("")}</span>` : ""}
      </div>`;
    }).join("");
  }

  function dispatchCandidateList(node) {
    const candidates = node?.candidates || [];
    if (!candidates.length) {
      return `<div class="method-call-empty">未解析出候选；请检查 dispatchHints、argparse 注册或静态分发表。</div>`;
    }
    const flow = currentExecutionFlow();
    const group = (flow?.dispatchGroups || []).find(item => item.parentNodeId === node.id);
    const scopeByRoot = new Map((group?.scopes || []).map(scope => [scope.rootFunctionId, scope]));
    return `<div class="method-call-list">${candidates.map(candidateId => {
      const detail = functionDetailById.get(candidateId);
      const name = detail?.qualifiedName || detail?.name || candidateId;
      const candidateScope = scopeByRoot.get(candidateId);
      const actionAttr = candidateScope
        ? `data-open-dispatch-candidate="${escapeHtml(candidateScope.id)}" data-dispatch-node="${escapeHtml(node.id)}"`
        : `data-open-exec-candidate="${escapeHtml(candidateId)}"`;
      return `<button class="detail-api-row" type="button" ${actionAttr}>
        <span class="detail-api-kind">${candidateScope ? "旅程" : "候选"}</span>
        <span class="detail-api-main">
          <span class="detail-api-name">${escapeHtml(name)}</span>
          ${humanNoteLine(detail?.note || "")}
          <span class="detail-api-meta">${escapeHtml(detail?.file || "")}:${escapeHtml(detail?.line || "—")}</span>
        </span>
        <span class="detail-api-badge">${candidateScope ? "打开" : "源码"}</span>
      </button>`;
    }).join("")}</div>`;
  }

  function apiButtonAttrs(api) {
    return [
      `data-api-id="${escapeHtml(api.id)}"`,
      `data-api-kind="${escapeHtml(api.kind)}"`,
      `data-provider-id="${escapeHtml(api.providerId || "")}"`,
      `data-provider-kind="${escapeHtml(api.providerKind || "")}"`,
      `data-module-id="${escapeHtml(api.moduleId || "")}"`,
      api.functionId ? `data-function-id="${escapeHtml(api.functionId)}"` : "",
    ].filter(Boolean).join(" ");
  }

  function apiChips(apis, limit, options = {}) {
    const items = (apis || []).slice(0, limit);
    if (!items.length) {
      return `<div class="module-api-empty">暂无公开接口</div>`;
    }
    const chips = items.map(api => {
      const label = apiDisplayName(api);
      const classes = ["module-api-chip", api.isEntry ? "is-entry" : "", api.kind.includes("context") || api.kind === "callable" || api.kind === "iterable" ? "is-protocol" : ""].filter(Boolean).join(" ");
      return `<button class="${classes}" type="button" ${apiButtonAttrs(api)} title="${escapeHtml(api.signature || label)}">${escapeHtml(label)}</button>`;
    }).join("");
    const more = (apis || []).length > items.length && options.showMore !== false
      ? `<span class="module-api-chip more">+${apis.length - items.length}</span>`
      : "";
    return chips + more;
  }

  function apiDetailList(apis) {
    if (!apis || !apis.length) return `<div class="class-method-empty">暂无公开接口</div>`;
    return apis.map(api => `<button class="detail-api-row" type="button" ${apiButtonAttrs(api)}>
        <span class="detail-api-kind">${escapeHtml(apiKindLabel(api.kind))}</span>
        <span class="detail-api-main">
          <span class="detail-api-name">${escapeHtml(apiDisplayName(api))}</span>
          ${humanNoteLine(apiHumanNote(api))}
        </span>
        <span class="detail-api-badge${api.inherited ? " is-inherited" : api.overridesCapabilityId ? " is-override" : ""}">${escapeHtml(apiExposureBadge(api))}</span>
      </button>`).join("");
  }

  function apiProviderList(providers) {
    if (!providers || !providers.length) {
      return `<div class="class-method-empty">暂无公开接口</div>`;
    }
    const groups = [];
    const byRole = new Map();
    providers.forEach(provider => {
      const role = provider.providerRole || "utility";
      if (!byRole.has(role)) {
        const items = [];
        byRole.set(role, items);
        groups.push([role, items]);
      }
      byRole.get(role).push(provider);
    });
    return groups.map(([role, items]) => `<div class="api-role-group">
      <div class="api-role-heading">${providerRoleBadge(role)}<span>${items.length} 个提供者</span></div>
      ${items.map(provider => `<div class="api-provider">
        <div class="api-provider-head">
          <span class="api-provider-kind">${escapeHtml(providerKindLabel(provider.providerKind))}</span>
          <b>${escapeHtml(provider.providerName || provider.providerId)}</b>
          <em>${provider.apiCount || (provider.apis || []).length} 个接口${Number(provider.inheritedApiCount || 0) ? ` · 继承 ${Number(provider.inheritedApiCount)}` : ""}</em>
        </div>
        ${apiDetailList(provider.apis || [])}
      </div>`).join("")}
    </div>`).join("");
  }

  function bindApiNavigation(root) {
    root.querySelectorAll("[data-provider-id]").forEach(button => {
      button.addEventListener("click", event => {
        event.stopPropagation();
        const functionId = button.dataset.functionId;
        const kind = button.dataset.apiKind;
        if (functionId && (kind === "method" || kind === "function")) {
          const target = functionDetailById.get(functionId);
          if (target) navigate({ kind: "function", moduleId: target.moduleId, functionId: target.id });
          return;
        }
        const providerId = button.dataset.providerId;
        if (!providerId) return;
        if (state.pageKind === "module" && state.nodes.has(providerId)) {
          selectUid(providerId);
          return;
        }
        const moduleId = button.dataset.moduleId;
        if (!moduleId) return;
        state.pendingSelectUid = providerId;
        navigate({ kind: "module", moduleId });
      });
    });
  }

  function annotationBlock(uid, sourceHash) {
    const annotation = annotations?.nodes?.[uid];
    if (!annotation) {
      return `<div class="llm-placeholder">
        <div class="llm-head"><span class="spark">✦</span><strong>LLM 语义说明</strong><em>占位</em></div>
        <div class="llm-copy">由语言大模型阅读源码后生成，展示职责边界、输入输出、关键约束与异常路径。</div>
        <div class="llm-skeleton">
          <div class="skeleton-row"><span class="skeleton-icon"></span><span class="skeleton-lines"><i></i><i></i></span></div>
          <div class="skeleton-row"><span class="skeleton-icon"></span><span class="skeleton-lines"><i></i><i></i></span></div>
          <div class="skeleton-row"><span class="skeleton-icon"></span><span class="skeleton-lines"><i></i><i></i></span></div>
        </div>
      </div>`;
    }
    const stale = sourceHash && annotation.sourceHash && annotation.sourceHash !== sourceHash;
    return `<div class="llm-placeholder">
      <div class="llm-head"><span class="spark">✦</span><strong>LLM 语义说明</strong><em>${stale ? "过期" : "已加载"}</em></div>
      <div class="llm-copy"><h3>${escapeHtml(annotation.summary || "")}</h3><p>${escapeHtml(annotation.details || "")}</p></div>
      ${stale ? `<div class="llm-stale">源码已变化，当前注解可能已过期。</div>` : ""}
    </div>`;
  }

  function renderDefaultDetail() {
    if (state.route.kind === "project") {
      const executionFlow = currentExecutionFlow();
      const flowCount = (projectGraph.executionFlows || []).length;
      detailScroll.innerHTML = `<div class="eyebrow">项目组成图</div>
        <h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(DATA.project.name)}</h2>
        <div class="detail-note">项目页提供独立主流程入口与模块能力卡片。流程与模块能力分开浏览，互不混用同一页面。</div>
        <div class="port-detail"><span>模块 <b>${visibleProjectModules().length}</b></span><span>执行流 <b>${flowCount}</b></span><span>类型关系 <b>${(projectGraph.typeRelations || []).length}</b></span><span>执行流节点 <b>${executionFlow?.nodeCount || 0}</b></span></div>
        ${annotationBlock(DATA.project.name)}

        return;
      }
      const scopeCount = (flow.scopes || []).length;
      detailScroll.innerHTML = `<div class="eyebrow">主执行流</div>
        <h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(flow.name || "主流程")}</h2>
        <div class="detail-note">入口函数的静态控制骨架。带 L1 标记的节点可打开一级接口下钻视图；更深实现进入方法详情。</div>
        <div class="port-detail"><span>入口 <b>${escapeHtml(flow.entrypointId || "—")}</b></span><span>节点 <b>${(flow.nodes || []).length}</b></span><span>边 <b>${(flow.edges || []).length}</b></span><span>接口 scope <b>${scopeCount}</b></span></div>
        ${annotationBlock(flow.entrypointId || flow.id)}
        <div class="empty-hint">单节点点击查看接口摘要；L1 按钮进入一级接口流程。</div>`;
      return;
    }
    if (state.route.kind === "scope") {
      const flow = currentExecutionFlow();
      const scope = currentExecutionScope();
      detailScroll.innerHTML = `<div class="eyebrow">一级接口下钻 · L1</div>
        <h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(scope?.name || "接口下钻")}</h2>
        <div class="detail-note">目标函数的一级接口骨架。只展示直接外部能力接口与必要控制结构，不递归展开内部实现。</div>
        <div class="port-detail"><span>来源主流程 <b>${escapeHtml(flow?.name || "—")}</b></span><span>L1 来源 <b>${escapeHtml(drilldownReasonLabel(scope?.reason))}</b></span><span>节点 <b>${Number(scope?.nodeCount || 0)}</b></span><span>边 <b>${Number(scope?.edgeCount || 0)}</b></span><span>外部接口 <b>${(scope?.interfaceSummary || []).length}</b></span></div>
        ${(scope?.interfaceSummary || []).length ? `<div class="class-method-section"><div class="class-method-heading">外部接口</div><div class="exec-interface-list">${scope.interfaceSummary.map(item => `<span class="exec-interface-chip"><b>${escapeHtml(item.moduleName || item.moduleId)}</b>${escapeHtml(item.label)}${Number(item.callCount || 1) > 1 ? ` ×${Number(item.callCount)}` : ""}</span>`).join("")}</div></div>` : ""}
        ${scope?.truncated ? `<div class="llm-stale">该 scope 已触发节点预算收缩，详情以源码与方法详情为准。</div>` : ""}
        <div class="empty-hint">点击节点查看语义；双击打开方法详情 / 源码。</div>`;
      return;
    }
    if (state.route.kind === "dispatch") {
      const flow = currentExecutionFlow();
      const group = currentExecutionDispatchGroup();
      const scope = currentExecutionScope();
      if (!group || !scope) {
        detailScroll.innerHTML = `<div class="eyebrow">分发候选旅程</div><h2 class="detail-name">暂无可解析候选旅程</h2><div class="detail-note">dispatch 节点存在，但没有可用于下钻的候选 scope。</div>`;
        return;
      }
      const truncated = group.truncated || scope.truncated;
      detailScroll.innerHTML = `<div class="eyebrow">分发候选旅程</div>
        <h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(scope.name || "候选旅程")}</h2>
        <div class="detail-note">dispatch 节点保持原子边界；当前候选以一级 callable scope 独立展开，不在主流程画布生成候选控制边。</div>
        <div class="port-detail"><span>表达式 <b>${escapeHtml(group.expression || "—")}</b></span><span>来源 <b>${escapeHtml(dispatchSourceLabel(group.candidateSource))}</b></span><span>候选 <b>${Number(group.candidateCount || 0)}</b></span><span>已生成 <b>${(group.scopes || []).length}</b></span><span>节点 <b>${Number(scope.nodeCount || 0)}</b></span></div>
        ${group.candidateSetComplete ? "" : `<div class="llm-stale">候选集合未声明完整；当前旅程只覆盖已知候选，不代表全部运行时路径。</div>`}
        ${truncated ? `<div class="llm-stale">候选旅程触发预算截断，未生成或已收缩的内容不在此 scope 中展开。</div>` : ""}
        ${(scope.interfaceSummary || []).length ? `<div class="class-method-section"><div class="class-method-heading">外部接口</div><div class="exec-interface-list">${scope.interfaceSummary.map(item => `<span class="exec-interface-chip"><b>${escapeHtml(item.moduleName || item.moduleId)}</b>${escapeHtml(item.label)}${Number(item.callCount || 1) > 1 ? ` ×${Number(item.callCount)}` : ""}</span>`).join("")}</div></div>` : ""}
        <div class="empty-hint">使用顶部候选列表切换旅程；双击节点打开方法详情 / 源码。</div>`;
      return;
    }
    if (state.route.kind === "module") {
      const module = moduleGraphById.get(state.route.moduleId);
      if (!module) return;
      const apis = module.providedApis || [];
      const providers = module.apiProviders || [];
      detailScroll.innerHTML = `<div class="detail-head" style="--mc:${module.color}"><div class="detail-color"></div><div>
          <div class="eyebrow">模块能力</div><h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(module.name)}</h2>
          <div class="detail-module">module://${escapeHtml(module.moduleId)} · ${escapeHtml(moduleRoleLabel(module.role))}</div></div></div>
        <div class="detail-note">${escapeHtml(module.note || "暂无模块备注")}</div>
        <div class="port-detail"><span>角色 <b>${escapeHtml(moduleRoleLabel(module.role || "service"))}</b></span><span>备注来源 <b>${escapeHtml(module.noteSource || "—")}</b></span><span>Provider <b>${providers.length}</b></span><span>接口 <b>${apis.length}</b></span><span>类型关系 <b>${(module.typeRelations || []).length}</b></span></div>
        <div class="class-method-section"><div class="class-method-heading">模块组成</div>${roleCompositionBlock(module)}</div>
        ${(module.userSurfaces || []).length ? `<div class="class-method-section"><div class="class-method-heading">用户交互面 · ${(module.userSurfaces || []).length}</div><div class="user-surface-track">${userSurfaceChips(module.userSurfaces || [], (module.userSurfaces || []).length)}</div></div>` : ""}
        <div class="class-method-section"><div class="class-method-heading">提供接口</div>${apiProviderList(providers)}</div>
        ${annotationBlock(module.moduleId)}
        <div class="empty-hint">双击自由函数进入方法详情；类节点右栏展示其提供接口。</div>`;
      bindApiNavigation(detailScroll);
      return;
    }
    const detail = functionDetailById.get(state.route.functionId);
    if (!detail) return;
    const module = projectModuleById.get(detail.moduleId);
    detailScroll.innerHTML = `<div class="detail-head" style="--mc:${module?.color || "#60a5fa"}"><div class="detail-color"></div><div>
        <div class="eyebrow">方法详情</div><h2 class="detail-name">${escapeHtml(detail.name)}</h2>
        <div class="detail-module">${escapeHtml(module?.name || detail.moduleId)} · ${escapeHtml(detail.module)}</div></div></div>
      <div class="detail-note">${escapeHtml(detail.note || "暂无函数备注")}</div>
      <div class="source-line">${escapeHtml(detail.file)}:${detail.line} · ${escapeHtml(detail.signature)}</div>
      ${annotationBlock(detail.id, detail.sourceHash)}
      <div class="empty-hint">左侧查看源码和调用关系；点击调用者/被调用者继续下钻。</div>`;
  }

        detailScroll.innerHTML = `<div class="detail-head" style="--mc:${macroNode.color || "#f59e0b"}"><div class="detail-color"></div><div>
            <div class="eyebrow">项目主流程</div><h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(macroNode.name || "主流程")}</h2>
            <div class="detail-module">${escapeHtml(macroNode.moduleName || macroNode.moduleId || "")}</div></div></div>
          <div class="detail-note">${escapeHtml(macroNode.note || "项目级主流程入口")}</div>
          <div class="port-detail"><span>入口 <b>${escapeHtml(macroNode.entrypointId || "—")}</b></span><span>节点 <b>${Number(macroNode.nodeCount || 0)}</b></span><span>边 <b>${Number(macroNode.edgeCount || 0)}</b></span></div>
          <div class="detail-actions"><button class="detail-action" type="button" data-open-flow-card-detail="${escapeHtml(macroNode.flowId)}">打开主流程 →</button></div>`;
        detailScroll.querySelector("[data-open-flow-card-detail]")?.addEventListener("click", () => {
          navigate({ kind: "flow", flowId: macroNode.flowId });
        });
        return;
      }
      if (macroNode.execution) {
        const module = projectModuleById.get(macroNode.moduleId);
        const targetId = macroNode.targetFunctionId || (
          ["entry", "free_function", "interface", "dispatch"].includes(macroNode.kind) ? macroNode.functionId : null
        );
        const detail = targetId ? functionDetailById.get(targetId) : null;
        const meta = [];
        if (macroNode.condition) meta.push(`条件：${macroNode.condition}`);
        if (macroNode.loopKind) meta.push(`循环类型：${macroNode.loopKind}`);
        if (macroNode.iterable) meta.push(`迭代对象：${macroNode.iterable}`);
        if (macroNode.loopVariable) meta.push(`循环变量：${macroNode.loopVariable}`);
        if (macroNode.mayExit === false) meta.push("静态判断：循环可能不会退出");
        if ((macroNode.cases || []).length) meta.push(`分支：${macroNode.cases.map(item => item.label).join(" / ")}`);
        if (macroNode.kind === "dispatch") {
          meta.push(`候选：${Number(macroNode.candidateCount || 0)} · ${macroNode.candidateSetComplete ? "完整" : "未声明完整"}`);
          meta.push(`来源：${dispatchSourceLabel(macroNode.candidateSource)}`);
          if (macroNode.drilldown?.kind === "dispatch" && macroNode.drilldown?.status === "available") {
            meta.push(`候选旅程：${Number(macroNode.drilldown.candidateScopeCount || 0)}`);
          }
        }
        detailScroll.innerHTML = `<div class="detail-head" style="--mc:${macroNode.color || module?.color || "#60a5fa"}"><div class="detail-color"></div><div>
            <div class="eyebrow">执行流 · ${escapeHtml(executionKindLabel(macroNode.kind))}</div>
            <h2 class="detail-name" style="font-family:var(--font);font-size:18px">${escapeHtml(macroNode.label || macroNode.id)}</h2>
            <div class="detail-module">${escapeHtml(module?.name || macroNode.moduleName || macroNode.moduleId || "")}</div></div></div>
          <div class="detail-note">${escapeHtml(macroNode.note || "主执行流节点")}</div>
          <div class="port-detail"><span>节点类型 <b>${escapeHtml(macroNode.kind)}</b></span><span>模块 <b>${escapeHtml(module?.name || macroNode.moduleId || "—")}</b></span>${macroNode.drilldown?.reason ? `<span>${macroNode.kind === "dispatch" ? "下钻来源" : "L1 来源"} <b>${escapeHtml(drilldownReasonLabel(macroNode.drilldown.reason))}</b></span>` : ""}${macroNode.capabilityKind ? `<span>能力 <b>${escapeHtml(macroNode.capabilityKind)}</b></span>` : ""}${macroNode.usageKind ? `<span>用法 <b>${escapeHtml(macroNode.usageKind)}</b></span>` : ""}</div>
          ${macroNode.kind === "interface" ? `<div class="empty-hint">功能接口是模块暴露的能力边界，不在主流程中展开内部实现；请打开方法详情或模块能力页查看。</div>` : ""}
          ${meta.length ? `<div class="source-line">${meta.map(item => escapeHtml(item)).join("<br>")}</div>` : ""}
          ${executionArmSummaryDetailHtml(macroNode)}
